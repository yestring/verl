# Format checks enforced on CI:
# 1. Comments must appear above each field.
# 2. There must be a blank line between each field.
# 3. Inline comments (after a field on the same line) are not allowed.
# 4. Indentation level is respected for nested fields.

# defaults specify the default config from each component
defaults:

  # fsdp optimizer config
  - ../optim@optim: fsdp

  # fsdp engine config
  - ../engine@fsdp_config: fsdp

  # dp actor config, inheriting from trainer/config/actor/actor.yaml
  - actor

  # load the reference default config, then apply the fields in the current yaml
  - _self_

# Target class for this configuration
_target_: verl.workers.config.FSDPActorConfig

# TODO(haibin.lin): switch to fsdp2
strategy: fsdp

# Gradient clipping for actor updates, specific to the strategy.
grad_clip: 1.0

# Sequence parallelism size for Ulysses-style model parallelism
# oc.select: the default val for ref.ulysses_sequence_parallel_size
# [DEPRECATED] use fsdp_config.ulysses_sequence_parallel_size instead
ulysses_sequence_parallel_size: 1

# calculate entropy with chunking to reduce memory peak
entropy_from_logits_with_chunking: False

# chunk size for entropy from logits with chunking
entropy_from_logits_chunk_size: 2048

# recompute entropy
entropy_checkpointing: False

# Entropy kernel backward strategy (one of SUPPORTED_BACKWARD_METHODS in verl.utils.kernel.kernels)
entropy_kernel_backward_method: split_dlogits_n

# Whether to use the fused forward entropy kernel (single-pass mainloop + epilogue)
entropy_kernel_forward_fused: False

# Override vocab_per_split for all entropy kernel families; null keeps per-strategy defaults
entropy_kernel_vocab_per_split: null

# Override n_group for grouped / owner-compute entropy strategies; null keeps defaults
entropy_kernel_n_group: null

# Override BLOCK_SIZE_M for the entropy kernels; null keeps per-family defaults
entropy_kernel_block_size_m: null

# Override BLOCK_SIZE_N for the entropy kernels; null keeps per-family defaults
entropy_kernel_block_size_n: null

# Override BLOCK_SIZE_K for the entropy kernels; null keeps per-family defaults
entropy_kernel_block_size_k: null

# fsdp config
fsdp_config:

  # Whether to use chunked entropy computation
  entropy_from_logits_with_chunking: ${oc.select:actor_rollout_ref.actor.entropy_from_logits_with_chunking,False}

  # Chunk size used by chunked entropy computation
  entropy_from_logits_chunk_size: ${oc.select:actor_rollout_ref.actor.entropy_from_logits_chunk_size,2048}

  # Whether to recompute entropy
  entropy_checkpointing: ${oc.select:actor_rollout_ref.actor.entropy_checkpointing,False}

  # Entropy kernel backward strategy
  entropy_kernel_backward_method: ${oc.select:actor_rollout_ref.actor.entropy_kernel_backward_method,split_dlogits_n}

  # Whether to use the fused forward entropy kernel
  entropy_kernel_forward_fused: ${oc.select:actor_rollout_ref.actor.entropy_kernel_forward_fused,False}

  # Override vocab_per_split for all entropy kernel families; null keeps per-strategy defaults
  entropy_kernel_vocab_per_split: ${oc.select:actor_rollout_ref.actor.entropy_kernel_vocab_per_split,null}

  # Override n_group for grouped / owner-compute entropy strategies; null keeps defaults
  entropy_kernel_n_group: ${oc.select:actor_rollout_ref.actor.entropy_kernel_n_group,null}

  # Override BLOCK_SIZE_M for the entropy kernels; null keeps per-family defaults
  entropy_kernel_block_size_m: ${oc.select:actor_rollout_ref.actor.entropy_kernel_block_size_m,null}

  # Override BLOCK_SIZE_N for the entropy kernels; null keeps per-family defaults
  entropy_kernel_block_size_n: ${oc.select:actor_rollout_ref.actor.entropy_kernel_block_size_n,null}

  # Override BLOCK_SIZE_K for the entropy kernels; null keeps per-family defaults
  entropy_kernel_block_size_k: ${oc.select:actor_rollout_ref.actor.entropy_kernel_block_size_k,null}

# Whether to remove padding tokens in inputs during training
use_remove_padding: ${oc.select:actor_rollout_ref.model.use_remove_padding,false}

