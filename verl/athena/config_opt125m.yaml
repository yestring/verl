# verl/athena/config_opt125m_single_gpu.yaml
# 适用于单卡 A100 剩余 8-9GB 显存的快速测试配置

defaults:
  - /verl/trainer/config/ppo_trainer@_here_   # 继承 VeRL 默认配置

#model_engine: megatron                              # 使用 FSDP（若想测 Megatron 可改为 megatron）

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false

data:
  train_files: ["/home/hx/data/gsm8k/train.parquet"]   # 请确认路径存在，若无数据可改为 dummy
  val_files: ["/home/hx/data/gsm8k/test.parquet"]
  val_batch_size: 1 
  train_batch_size: 2
  max_prompt_length: 64
  max_response_length: 4
  filter_overlong_prompts: true
  truncation: truncate 

actor_rollout_ref:
  model:
    path: /home/hx/opt-125m
    use_remove_padding: true
    enable_gradient_checkpointing: true       # 节省显存
  actor:
    optim:
      lr: 1e-6
    ppo_mini_batch_size: 2
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 128
    use_kl_loss: false
    kl_loss_coef: 0.001
    entropy_coeff: 0
    fsdp_config:
      param_offload: true
      optimizer_offload: true
  rollout:
    name: vllm
    tensor_model_parallel_size: 1
    n: 1
    gpu_memory_utilization: 0.05              # vLLM 显存占用降低
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 128
    log_prob_micro_batch_size_per_gpu: 1
  ref:
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 128
    fsdp_config:
      param_offload: true                     # Ref 模型卸载到 CPU，进一步省显存

trainer:
  n_gpus_per_node: 2                         # 单卡测试
  nnodes: 1
  total_epochs: 1
  total_training_steps: 10                    # 短跑验证
  save_freq: -1
  test_freq: -1
  balance_batch: false
  project_name: athena_opt_test
  experiment_name: opt125m_single
  logger: ["console"]
  v1:
    trainer_mode: athena_trainer
  athena_log_dir: ./athena_logs
  athena:
    enabled: true
    window_size: 3
    cooldown_steps: 2
    low_memory_threshold: 0.70
    high_memory_threshold: 0.90
    low_gpu_utilization_threshold: 0.55
    min_token_budget: 128
    max_token_budget: 1024
    offline:
      # Weights do not need to sum to one; Athena normalizes active metrics.
      # MFU is omitted for now because this FSDP run reports it as zero.
      utility_weights:
        throughput: 0.55
        step_time: 0.20
        peak_memory_gb: 0.10
        throughput_cv: 0.15
      constraints:
        # Per-trial PyTorch peak allocation, not total memory used by other jobs.
        peak_memory_gb:
          max: 7.0
        gpu_count:
          eq: 2
