algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
data:
  train_files:
  - /home/hx/data/gsm8k/train.parquet
  val_files:
  - /home/hx/data/gsm8k/test.parquet
  train_batch_size: 32
  max_prompt_length: 128
  max_response_length: 64
  filter_overlong_prompts: true
  truncation: error
actor_rollout_ref:
  model:
    path: /home/hx/Qwen2.5-1.5B-Instruct
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    optim:
      lr: 1e-6
    ppo_mini_batch_size: 1
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 1024
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    fsdp_config:
      param_offload: false
      optimizer_offload: false
  rollout:
    name: vllm
    tensor_model_parallel_size: 1
    n: 2
    gpu_memory_utilization: 0.2
    log_prob_use_dynamic_bsz: true
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 1024
  ref:
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 1024
    fsdp_config:
      param_offload: true
trainer:
  nnodes: 1
  n_gpus_per_node: 1
  total_epochs: 1
  save_freq: -1
  test_freq: -1
  balance_batch: false
  project_name: verl_debug
  experiment_name: qwen2_1.5b_debug
  logger:
  - console
  v1:
    trainer_mode: athena_trainer
  athena_log_dir: ./athena_logs
  resume_mode: disable
  resume_from_path: null
